name: Bug report
description: Report one reproducible defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Defect and scope
      description: Describe one defect, affected surface, and what is out of scope.
    validations:
      required: true
  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites and environment
      description: List required setup, related issue/PR, versions, and feature flags. Write "None" only when there are no prerequisites.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Use synthetic data only; never paste credentials, private documents, or recordings.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Test evidence
      description: Include the failing test or reproducible command, then the expected verification after a fix.
    validations:
      required: true
